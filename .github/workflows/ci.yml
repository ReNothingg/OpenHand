name: Verify OpenHand

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  web:
    name: Web checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:web
      - run: node scripts/sync-macos-web.mjs
      - run: npm run verify:web-sync

  macos:
    name: macOS desktop
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run macos:sync
      - run: npm run verify:web-sync
      - run: sh macos/scripts/test-serial-smoke.sh
      - run: OPENHAND_SKIP_WEB_BUILD=1 npm run macos:build

  windows:
    name: Windows desktop
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run windows:build
