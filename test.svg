<svg xmlns="http://www.w3.org/2000/svg" width="860" height="640" viewBox="0 0 430 320">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse"
            markerUnits="strokeWidth">
      <path d="M 0 1.5 L 9 5 L 0 8.5 L 2.2 5 Z" fill="#111"/>
    </marker>
    <style>
      .object {
        fill: none;
        stroke: #111;
        stroke-width: 5;
        stroke-linecap: square;
        stroke-linejoin: miter;
      }
      .thin {
        fill: none;
        stroke: #111;
        stroke-width: 1.35;
        stroke-linecap: square;
      }
      .center {
        fill: none;
        stroke: #111;
        stroke-width: 1.15;
        stroke-dasharray: 14 4 3 4;
      }
      .dimension {
        fill: none;
        stroke: #111;
        stroke-width: 1.25;
        marker-start: url(#arrow);
        marker-end: url(#arrow);
      }
      .label {
        fill: #111;
        font-family: "Times New Roman", "Liberation Serif", serif;
        font-size: 24px;
        font-weight: 600;
        font-style: italic;
        text-anchor: middle;
      }
      .small-label {
        fill: #111;
        font-family: "Times New Roman", "Liberation Serif", serif;
        font-size: 22px;
        font-weight: 600;
        font-style: italic;
      }
    </style>
  </defs>


  <!-- Контур детали: 20 × 20 с верхним пазом 5 × 5 -->
  <path class="object"
        d="M 94 62
           H 164
           V 113
           H 212
           V 62
           H 287
           V 253
           H 94
           Z"/>

  <!-- Отверстие Ø7 -->
  <circle class="object" cx="189" cy="188" r="35"/>

  <!-- Осевые линии -->
  <path class="center" d="M 57 188 H 337"/>
  <path class="center" d="M 189 138 V 238"/>

  <!-- Размер общей ширины 20 -->
  <path class="thin" d="M 94 255 V 313"/>
  <path class="thin" d="M 287 255 V 313"/>
  <path class="dimension" d="M 98 303 H 283"/>
  <text class="label" x="190.5" y="294">20</text>

  <!-- Размер общей высоты 20 -->
  <path class="thin" d="M 289 62 H 390"/>
  <path class="thin" d="M 289 253 H 390"/>
  <path class="dimension" d="M 378 66 V 249"/>
  <text class="label" x="369" y="158" transform="rotate(-90 369 158)">20</text>

  <!-- Ширина паза 5 -->
  <path class="thin" d="M 164 59 V 20"/>
  <path class="thin" d="M 212 59 V 20"/>
  <path class="dimension" d="M 168 30 H 208"/>
  <text class="label" x="188" y="21">5</text>

  <!-- Глубина паза 5 -->
  <path class="thin" d="M 214 62 H 344"/>
  <path class="thin" d="M 214 113 H 344"/>
  <path class="dimension" d="M 333 66 V 109"/>
  <text class="label" x="324" y="89" transform="rotate(-90 324 89)">5</text>

  <!-- Расстояние от оси отверстия до низа 7 -->
  <path class="thin" d="M 289 188 H 344"/>
  <path class="thin" d="M 289 253 H 344"/>
  <path class="dimension" d="M 333 192 V 249"/>
  <text class="label" x="324" y="221" transform="rotate(-90 324 221)">7</text>

  <!-- Диаметр отверстия Ø7 -->
  <path class="thin" d="M 59 153 H 154"/>
  <path class="thin" d="M 59 223 H 154"/>
  <path class="dimension" d="M 63 157 V 219"/>
  <text class="label" x="53" y="188" transform="rotate(-90 53 188)">⌀7</text>

  <!-- Выноска S6 -->
  <text class="small-label" x="40" y="23">S6</text>
  <path class="thin" d="M 39 30 H 75 L 107 63 L 139 98"/>
  <circle cx="139" cy="98" r="3.2" fill="#111"/>
</svg>
